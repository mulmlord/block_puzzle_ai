[project]
name = "block-puzzle-ai"
version = "0.1.0"
description = "Reverse-engineered block puzzle simulator and RL agent that learns to maximize the high score"
authors = [
    { name = "Mudcrawler", email = "kenny.loeffler@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pyelftools>=0.33",
    "torch>=2.15.0",
    "unicorn>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/block_puzzle_ai"]
cmake.build-type = "Release"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "cpp/**" }]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
